# Build the Quarto site and publish it to the gh-pages branch, which GitHub
# Pages serves. Runs on every push to main, so publishing is just a push.
#
# Pinned to Quarto 1.8.25, the version the site has always been built with;
# a different version rewrites boilerplate across every page.
#
# Python + Jupyter are needed even though nothing executes at render time:
# Quarto routes documents with {pyodide} cells through its Jupyter engine.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jupyter
        run: pip install jupyter pyyaml

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25

      - name: Render
        run: quarto render

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "render: ${{ github.event.head_commit.message }}"
